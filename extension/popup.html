<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jolt finder</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <h1><i class="mark"></i>Jolt finder</h1>
    <p id="state" class="state" role="status"></p>
    <p id="error" class="error" hidden></p>
    <div class="row">
      <button id="people" class="primary">Find people now</button>
    </div>
    <button id="resume" class="primary" hidden>Resume hourly runs</button>
    <label class="check"><input id="enabled" type="checkbox" /> Look for people every hour</label>
    <p id="hours" class="hint"></p>
    <p id="claude" class="hint"></p>
    <details>
      <summary>What happened</summary>
      <pre id="log"></pre>
    </details>
    <p class="links"><a id="settings" href="#">Settings</a> <a id="page" href="#" target="_blank">Open the page</a></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
